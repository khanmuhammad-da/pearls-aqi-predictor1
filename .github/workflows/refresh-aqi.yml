name: Refresh Live AQI

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-aqi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh live AQI
        run: python scripts/refresh_aqi.py

      - name: Commit refreshed AQI data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/data/pearl_live_aqi_intelligence.json
          git add app/data/pearl_intelligence_dashboard_data.json

          if git diff --cached --quiet; then
            echo "No AQI data changes to commit."
          else
            git commit -m "chore: refresh live AQI data"
            git push
          fi
